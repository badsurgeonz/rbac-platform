server:
  port: 8080
spring:
  application:
    name: gateway-service
  config:
    import: "optional:nacos:application.yml?group=DEFAULT_GROUP&refreshEnabled=true,optional:nacos:gateway-service.yml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        ephemeral: false
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
    gateway:
      routes:
        - id: auth
          uri: lb://auth-service
          predicates: [ Path=/auth/** ]
        - id: permission
          uri: lb://permission-service
          predicates: [ Path=/permissions/** ]
          metadata:
            required-permission: permission:read
            write-methods: PUT,POST,DELETE
        - id: audit
          uri: lb://audit-service
          predicates: [ Path=/audit/** ]
          metadata:
            required-permission: audit:read
            write-methods: POST
            write-permission: audit:write
        - id: admin
          uri: lb://admin-api
          predicates: [ Path=/admin/** ]
          metadata:
            required-permission: admin:read
            write-methods: PUT,POST,DELETE
            write-permission: admin:write
        - id: business
          uri: lb://business-service
          predicates: [ Path=/business/** ]
          metadata:
            required-permission: business:read
security.jwt.issuer: ${JWT_ISSUER:rbac-platform}
security.jwt.audience: ${JWT_AUDIENCE:rbac-api}
security.jwt.secret: ${JWT_SECRET}
security.internal.secret: ${INTERNAL_REQUEST_SECRET}
security.internal.timestamp-skew-seconds: ${INTERNAL_REQUEST_TIMESTAMP_SKEW_SECONDS:30}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
