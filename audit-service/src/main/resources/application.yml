server:
  port: 9003
spring:
  application:
    name: audit-service
  config:
    import: "optional:nacos:application.yml?group=DEFAULT_GROUP&refreshEnabled=true,optional:nacos:audit-service.yml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        ephemeral: false
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        refresh-enabled: true
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/rbac?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8"
    username: ${MYSQL_USER:rbac}
    password: ${MYSQL_PASSWORD:rbac123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener.simple.default-requeue-rejected: false
security.internal.secret: ${INTERNAL_REQUEST_SECRET}
security.internal.timestamp-skew-seconds: ${INTERNAL_REQUEST_TIMESTAMP_SKEW_SECONDS:30}
security.jwt.secret: ${JWT_SECRET}
security.jwt.issuer: ${JWT_ISSUER:rbac-platform}
security.jwt.audience: ${JWT_AUDIENCE:rbac-api}
audit:
  archive:
    retention-days: ${AUDIT_RETENTION_DAYS:365}
    cron: ${AUDIT_ARCHIVE_CRON:0 30 2 * * *}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
