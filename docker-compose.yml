services:
  mysql: { image: mysql:8.0, environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: rbac, MYSQL_USER: rbac, MYSQL_PASSWORD: rbac123 }, ports: ["3306:3306"], volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"] }
  redis: { image: redis:7-alpine, ports: ["6379:6379"] }
  rabbitmq: { image: rabbitmq:3-management, ports: ["5672:5672","15672:15672"] }
  nacos: { image: nacos/nacos-server:v2.4.3, environment: { MODE: standalone, NACOS_AUTH_ENABLE: "false" }, ports: ["8848:8848","9848:9848"] }
  sentinel-dashboard: { image: bladex/sentinel-dashboard:1.8.6, ports: ["8858:8858"] }
