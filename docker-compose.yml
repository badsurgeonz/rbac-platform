services:
  mysql: { image: mysql:8.0, environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: rbac, MYSQL_USER: rbac, MYSQL_PASSWORD: rbac123 }, ports: ["3306:3306"], volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"], healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"], interval: 10s, timeout: 5s, retries: 12 } }
  redis: { image: redis:7-alpine, ports: ["6379:6379"], healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 12 } }
  rabbitmq: { image: rabbitmq:3-management, ports: ["5672:5672","15672:15672"], healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 12 } }
  nacos: { image: nacos/nacos-server:v2.4.3, environment: { MODE: standalone, NACOS_AUTH_ENABLE: "false" }, ports: ["8848:8848","9848:9848"], healthcheck: { test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/actuator/health || exit 1"], interval: 15s, timeout: 5s, retries: 20 } }
  prometheus: { image: prom/prometheus:v2.55.1, ports: ["9090:9090"], volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro","./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"], command: ["--config.file=/etc/prometheus/prometheus.yml"] }
  sentinel-dashboard: { image: bladex/sentinel-dashboard:1.8.6, ports: ["8858:8858"] }
