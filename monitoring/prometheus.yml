global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [host.docker.internal:8080] }]
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [host.docker.internal:9001] }]
  - job_name: permission-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [host.docker.internal:9002] }]
  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [host.docker.internal:9003] }]
  - job_name: admin-api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [host.docker.internal:9004] }]
